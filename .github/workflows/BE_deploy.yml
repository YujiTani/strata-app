name: BE_Deploy
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:be
      
      - name: Run lint
        run: bun run lint

      # デプロイの前に流す。ここで失敗すれば deploy ステップは実行されず、
      # スキーマが古いまま新しいコードが本番に出ることを防げる。
      # 接続はプール経由ではなく直結（unpooled）を使う（DDL のため）。
      - name: Run DB migrations
        run: bun run db:migrate
        working-directory: apps/server
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      
      - name: Deploy to fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

